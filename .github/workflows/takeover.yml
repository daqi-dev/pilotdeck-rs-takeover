name: takeover

# 接手分支的 CI：只做 CLAUDE.md「构建与测试」里的四条命令。
# 旧的 ci.yml / pr-gate.yml 留在原处不动：它们只在 pull_request、push 到 main、
# merge_group 时触发，接手仓库只推 dev/takeover，所以实际不跑。说明见 state/takeover.md。
# 对基线的黑盒对拍（scripts/bbx）需要基线的 dist，目前只在本机跑，不在这里。

on:
  push:
    branches: [dev/takeover]
  workflow_dispatch:

concurrency:
  group: takeover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src -> target
          cache-bin: false
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      # 以下两个工具沿用旧 CI 的做法：钉版本、从源码编译、按版本缓存，不下载预编译二进制。
      # grep 相关测试的金样以 ripgrep 15.0.0 录制。
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rg
          key: ripgrep-15.0.0-${{ runner.os }}
      - name: ripgrep 15.0.0
        run: |
          "$HOME/.cargo/bin/rg" --version 2>/dev/null | grep -qx 'ripgrep 15.0.0' \
            || cargo install ripgrep --locked --version 15.0.0 --force
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: cargo-nextest-0.9.148-${{ runner.os }}-${{ runner.arch }}
      - name: cargo-nextest 0.9.148
        run: |
          "$HOME/.cargo/bin/cargo-nextest" --version 2>/dev/null | grep -qx 'cargo-nextest 0.9.148' \
            || cargo install cargo-nextest --locked --version 0.9.148 --force
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: nextest
        env:
          # 权限故障类用例在特权宿主上只能跳过；CI 上把跳过变成硬失败（沿用旧 CI）。
          PDRS_REQUIRE_PERMISSION_FAULTS: "1"
        run: cargo nextest run --workspace --no-fail-fast --profile ci --config-file ../.config/nextest.toml
      - name: doctest
        run: cargo test --workspace --doc

# pilotdeck-rs/trusted-http-host —— MintHub 源码包清单（对应 `src/pilotdeck-trusted-http-host`）
[package]
name = "pilotdeck-rs/trusted-http-host"
version = "0.1.0"
kind = "bundle"
description = "PilotDeck 经 Kernel egress 策略与审计门控的受信模型 HTTP 宿主实现：作用域连接池、两段请求头预检、凭据隔离与重定向核验。"
license = "AGPL-3.0-only"
repository = "https://github.com/daqi-dev/pilotdeck-rs-takeover"
keywords = ["pilotdeck", "http", "host", "egress", "policy"]

[artifacts]
layout = "any"

[provides]
# Pure Rust source bundle from pilotdeck-rs/src; no iface identity or runtime plugin exports.

[requires]
api = ">=0.1"
interfaces = ["env", "policy", "types"]

[capabilities]
net = ["http://127.0.0.1", "https://*"]

[capabilities.reason]
net = "Outbound model HTTP transport strictly mediated through Kernel egress policy and audit gates"

[dependencies]
"pilotdeck-rs/protocol" = "=0.1.0"
"pilotdeck-rs/model-core" = "=0.1.0"
"pilotdeck-rs/model-runtime" = "=0.1.0"
"pilotdeck-rs/http-transport" = "=0.1.0"
"agentcpm/iface" = ">=0.1.6, <0.2.0"
"agentcpm/core" = ">=0.1.2, <0.2.0"
"agentcpm/host" = ">=0.1.6, <0.2.0"
"iface/env" = ">=0.1.7, <0.2.0"
"iface/policy" = ">=0.1.11, <0.2.0"
"iface/types" = ">=0.1.8, <0.2.0"

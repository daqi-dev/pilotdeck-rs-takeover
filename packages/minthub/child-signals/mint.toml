# pilotdeck-rs/child-signals —— MintHub 源码包清单（对应 `src/pilotdeck-child-signals`）
[package]
name = "pilotdeck-rs/child-signals"
version = "0.1.0"
kind = "bundle"
description = "Unix 子进程 spawn 前置安全钩子（#386 / #552）：在 fork-to-exec 窗口重置继承信号并按需执行 setsid()。"
license = "AGPL-3.0-only"
repository = "https://github.com/daqi-dev/pilotdeck-rs-takeover"
keywords = ["pilotdeck", "unix", "signals", "process", "setsid"]

[artifacts]
layout = "any"

[provides]
# Pure Rust source bundle from pilotdeck-rs/src; no iface identity or runtime plugin exports.

[requires]
api = ">=0.1"

[dependencies]
# 无内部或 Kernel 包依赖。

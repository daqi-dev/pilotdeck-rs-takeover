# pilotdeck-rs/iface —— MintHub 源码包清单（对应 `src/pilotdeck-iface`）
[package]
name = "pilotdeck-rs/iface"
version = "0.1.3"
kind = "bundle"
description = "PilotDeck 接入公开 ifACE Scheduler SDK 的 AgentLoop 外壳：原生/恢复启动入口、资源多路编解码与 Kernel 客户端桥接。"
license = "AGPL-3.0-only"
repository = "https://github.com/daqi-dev/pilotdeck-rs-takeover"
keywords = ["pilotdeck", "iface", "loop", "scheduler", "kernel"]
authors = ["郑达奇 (daqi-dev)"]

[artifacts]
layout = "any"

[provides]
# Pure Rust source bundle from pilotdeck-rs/src; no iface identity or runtime plugin exports.

[requires]
api = ">=0.1"
interfaces = ["loop", "model", "tool", "context", "session", "types"]

[dependencies]
"pilotdeck-rs/protocol" = "=0.1.0"
"pilotdeck-rs/agent" = "=0.1.0"
"pilotdeck-rs/turn-preparation" = "=0.1.0"
"pilotdeck-rs/transport" = "=0.1.0"
"pilotdeck-rs/context-iface" = "=0.1.2"
"pilotdeck-rs/context-runtime" = "=0.1.0"
"agentcpm/iface" = ">=0.1.6, <0.2.0"
"agentcpm/core" = ">=0.1.2, <0.2.0"
"agentcpm/host" = ">=0.1.6, <0.2.0"
"iface/loop" = ">=0.1.4, <0.2.0"
"iface/model" = ">=0.1.4, <0.2.0"
"iface/tool" = ">=0.1.3, <0.2.0"
"iface/context" = ">=0.1.5, <0.2.0"
"iface/session" = ">=0.1.13, <0.2.0"
"iface/types" = ">=0.1.8, <0.2.0"

# pilotdeck-rs/context-iface —— MintHub 源码包清单（对应 `src/pilotdeck-context-iface`）
[package]
name = "pilotdeck-rs/context-iface"
version = "0.1.0"
kind = "bundle"
description = "PilotDeck 面向 Kernel ifACE 公开契约（context / store / types）的上下文适配包：TokenCounter、ContextContract、CompactionPersistenceContract 与版本化权威状态账本。"
license = "AGPL-3.0-only"
repository = "https://github.com/daqi-dev/pilotdeck-rs-takeover"
keywords = ["pilotdeck", "iface", "context", "compaction", "tokenizer"]

[artifacts]
layout = "any"

[provides]
# Pure Rust source bundle from pilotdeck-rs/src; no iface identity or runtime plugin exports.

[requires]
api = ">=0.1"
interfaces = ["context", "store", "types"]

[dependencies]
"pilotdeck-rs/protocol" = "=0.1.0"
"pilotdeck-rs/tokenizer" = "=0.1.0"
"pilotdeck-rs/context-core" = "=0.1.0"
"pilotdeck-rs/context-runtime" = "=0.1.0"
"pilotdeck-rs/model-core" = "=0.1.0"
"agentcpm/iface" = ">=0.1.6, <0.2.0"
"iface/context" = ">=0.1.5, <0.2.0"
"iface/store" = ">=0.1.3, <0.2.0"
"iface/types" = ">=0.1.8, <0.2.0"

# pilotdeck-rs/pilotdeck —— 产品仓源码闭包配方（kind = "preset"）
#
# 背景（2026-11-18，Wave 5 门修复）：
#   Kernel 侧 `agentcpm/pilotdeck-dev`（agent-kernel 仓 products/pilotdeck）是
#   「Kernel + PD 声明包」桥接配方，**不引用** `pilotdeck-rs/*` 源码包（见该文件
#   第四节第 7 条）。两级门 §2.1 自查项 6 要求产品包被 products/* 配方引用；本文件
#   是产品仓侧的等价引用：把 pilotdeck-rs 全部 20 个源码 bundle 的**根集**（按
#   依赖入度计算，闭包会带出其余 12 个传递包）钉进同一条配方。
#   依据：scripts/verify-minthub-stitched-assembly.sh 的 online-roots 计算口径
#   （同一入度算法；8 个根 = child-signals / regex-proto / yaml / model-iface /
#   tool-iface / trusted-http-host / session-migration / iface）。
#
# 语义：本包**不含实现、不执行代码、不声明任何权限**，只有 [dependencies]。
# 它声明的是「从 MintHub 装齐 pilotdeck-rs 源码闭包所需的根集」，由 mint 解析成
# 依赖图与 lock；实际能跑通的可复现证据见
# scripts/verify-minthub-stitched-assembly.sh（双平台 4 阶段）。
#
# 维护规则：
#   · 根集成员随 20 包依赖图变化而变（升版重算入度；脚本 online-roots 是唯一口径）。
#   · 全部精确钉 `=<version>`；任何成员升版 ⇒ 改本文件对应钉 + preset 版本 +1。
#   · 本文件不被 scripts/publish-pilotdeck-mint-hub.sh 管理（该脚本强制
#     packages/minthub 恰为 20 个 bundle）；如需发布用 mint pack/publish 手动执行并留痕。

[package]
name = "pilotdeck-rs/pilotdeck"
version = "0.1.0"
kind = "preset"
description = "PilotDeck Rust 源码闭包配方：8 个根包（child-signals、regex-proto、yaml、model-iface、tool-iface、trusted-http-host、session-migration、iface）的精确钉，传递闭包覆盖全部 20 个 pilotdeck-rs/* 源码 bundle。"
license = "AGPL-3.0-only"
repository = "https://github.com/daqi-dev/pilotdeck-rs-takeover"
keywords = ["preset", "pilotdeck", "rust", "closure"]
authors = ["郑达奇 (daqi-dev)"]

[requires]
api = ">=0.1"

[provides]
presets = ["pilotdeck"]

[dependencies]
# 根集（入度 0；Wave 5 版本，2026-11-18）
"pilotdeck-rs/child-signals" = "=0.1.0"      # 子进程信号契约（无 pilotdeck-rs 内依赖）
"pilotdeck-rs/regex-proto" = "=0.1.0"        # 确定性正则协议（无 pilotdeck-rs 内依赖）
"pilotdeck-rs/yaml" = "=0.1.0"               # 有界 YAML 解析（无 pilotdeck-rs 内依赖）
"pilotdeck-rs/model-iface" = "=0.1.0"        # 模型契约适配根（传递带 model-runtime/model-core 等）
"pilotdeck-rs/tool-iface" = "=0.1.4"         # 工具契约适配根（传递带 tool-core/transport 等）
"pilotdeck-rs/trusted-http-host" = "=0.1.0"  # 可信 HTTP 宿主边界（无 pilotdeck-rs 内依赖）
"pilotdeck-rs/session-migration" = "=0.1.2"  # 会话归属迁移根（传递带 context-iface/context-core 等）
"pilotdeck-rs/iface" = "=0.1.3"             # AgentLoop 外壳根（传递带 agent/protocol/tokenizer 等全部）

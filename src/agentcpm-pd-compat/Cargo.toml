# Optional `pilotdeck` compat shim crate (S4). Mounted as a workspace
# member (src/Cargo.toml) since S3 delivery; the standalone empty
# `[workspace]` table era ended with the S4 integration.
[package]
name = "agentcpm-pd-compat"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only"
publish = false
description = "Optional `pilotdeck` compatibility shim over the agentcpm-pd public CLI"

[lib]
name = "agentcpm_pd_compat"
path = "src/lib.rs"

# The shim binary is built as `pilotdeck-compat` inside the workspace: the
# old `pilotdeck-cli` crate (frozen TS-migration line) already owns the
# `pilotdeck` bin name and both would collide in target/. The runtime entry
# identity is unchanged — a distribution installs this binary under whatever
# legacy name it chooses (argv[0] only feeds the multi-call rejection table).
[[bin]]
name = "pilotdeck-compat"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

# Independent manifest for the optional `pilotdeck` compat shim crate.
# The empty `[workspace]` table detaches this crate from the parent
# `src/` workspace so it can be built and tested on its own (S4 plan §4);
# S3 integration will mount it into the workspace and remove this table.
[workspace]

[package]
name = "agentcpm-pd-compat"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only"
publish = false
description = "Optional `pilotdeck` compatibility shim over the agentcpm-pd public CLI"

[lib]
name = "agentcpm_pd_compat"
path = "src/lib.rs"

[[bin]]
name = "pilotdeck"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

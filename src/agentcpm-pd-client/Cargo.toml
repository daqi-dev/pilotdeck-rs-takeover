[package]
name = "agentcpm-pd-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agentcpm-pd-protocol = { path = "../agentcpm-pd-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
url = "=2.5.8"
# t015: "signal" gives the attach process SIGINT (and the CLI binary shares
# this pin; no version or download change).
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "io-std", "sync", "process", "fs", "signal"] }
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "=0.3.31", default-features = false, features = ["sink", "std"] }
# t015: the attach process switches a human tty to raw mode through
# rustix termios (safe APIs, same pinned version, feature additions only).
rustix = { version = "=1.1.5", features = ["fs", "process", "termios"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }

[lints]
workspace = true

[package]
name = "pilotdeck-trusted-http-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agentcpm-iface.workspace = true
agentcpm-host = { path = "../../deps/agent-kernel/kernel/host", default-features = false }
agentcpm-core = { path = "../../deps/agent-kernel/kernel/core" }
pilotdeck-http-transport = { path = "../pilotdeck-http-transport" }
pilotdeck-model-core = { path = "../pilotdeck-model-core" }
pilotdeck-model-runtime = { path = "../pilotdeck-model-runtime" }
pilotdeck-protocol.workspace = true
url = "=2.5.8"
bytes = "=1.10.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.7.0", features = ["client", "http1"] }
tokio = { version = "=1.48.0", features = ["rt", "net", "time", "io-util", "sync"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["macros", "rt", "sync"] }

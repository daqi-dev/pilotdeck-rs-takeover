[package]
name = "pilotdeck-child-signals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "deny"

# Cargo cannot inherit one lint group while overriding another; keep this
# identical to workspace.lints.clippy (checked by unsafe_boundary).
[lints.clippy]
all = "warn"
# #438: a side effect inside debug_assert! vanishes in release builds.
debug_assert_with_mut_call = "warn"

[dependencies]
libc = "=0.2.190"
# t015 PR-1: setsid + TIOCSCTTY for the pty controlling-terminal hook. The
# `process` feature is where rustix 1.1.5 gates both `setsid` and
# `ioctl_tiocsctty` (its `pty`/`termios` features only cover the openpt
# family and tcsetattr/tcsetwinsize, which live in agentcpm-pd-pty).
rustix = { version = "=1.1.5", features = ["process"] }

[package]
name = "agentcpm-pd-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["embedded-gateway"]
embedded-gateway = ["dep:pilotdeck-gateway"]

[[bin]]
name = "agentcpm-pd"
path = "src/main.rs"

[dependencies]
agentcpm-pd-protocol = { path = "../agentcpm-pd-protocol" }
agentcpm-pd-client = { path = "../agentcpm-pd-client" }
pilotdeck-gateway = { path = "../pilotdeck-gateway", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "signal", "time", "io-util", "sync"] }

[lints]
workspace = true

[package]
name = "agentcpm-pd-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["embedded-gateway"]
embedded-gateway = ["dep:pilotdeck-gateway"]

[[bin]]
name = "agentcpm-pd"
path = "src/main.rs"

[dependencies]
agentcpm-pd-protocol = { path = "../agentcpm-pd-protocol" }
agentcpm-pd-client = { path = "../agentcpm-pd-client" }
pilotdeck-gateway = { path = "../pilotdeck-gateway", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2 = "=0.10.9"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "signal", "time", "io-util", "io-std", "sync", "process"] }

[dev-dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }
# t015: the terminals e2e suites decode/encode pty bytes (base64 frames).
base64 = "=0.22.1"

[lints]
workspace = true

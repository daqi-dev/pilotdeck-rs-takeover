[workspace]
resolver = "3"
exclude = ["vendor/tiktoken-rs", "vendor/icu_collator", "data/icu_collator_data"]
members = [
    "pilotdeck-cli",
    "pilotdeck-agent",
    "pilotdeck-transport",
    "pilotdeck-protocol",
    "pilotdeck-tokenizer",
    "pilotdeck-gateway",
    "pilotdeck-child-signals",
    "pilotdeck-yaml",
]

[workspace.package]
edition = "2024"
rust-version = "1.93"
version = "0.1.0"
license = "AGPL-3.0-only"
license-file = "../LICENSE"
publish = false

[workspace.dependencies]
serde_json = { version = "=1.0.151", features = ["raw_value"] }
ryu-js = "=1.0.3"
sha2 = "=0.10.9"
tz-rs = { version = "=0.7.3", default-features = false, features = ["alloc"] }
# IANA tzdb 2025b compiled to TZif, embedded as data (no build script, no deps):
# named zones resolve like Node/ICU without reading the host zoneinfo tree.
jiff-tzdb = "=0.1.4"
pilotdeck-protocol = { path = "pilotdeck-protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
# #438: a side effect inside debug_assert! vanishes in release builds.
debug_assert_with_mut_call = "warn"

# 调试构建开一档优化。不开时 tokenizer 首次初始化约 723 ms（发布构建 116 ms、基线约 400 ms），
# 一轮比基线慢一倍多，超时与中止类对拍场景因此走向不同；开到 1 后一轮耗时接近发布构建。
# 代价：全量构建多约 45 s，增量构建持平。量测见 state/issues.md（2026-11-14，cb8）。
[profile.dev]
opt-level = 1

# D6 data stays pinned; #132 adds a source patch to preserve isolated UTF-16 weights.
[patch.crates-io]
icu_collator_data = { path = "data/icu_collator_data" }
icu_collator = { path = "vendor/icu_collator" }

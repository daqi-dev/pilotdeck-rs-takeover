[workspace]
resolver = "3"
exclude = ["vendor/tiktoken-rs", "vendor/icu_collator", "data/icu_collator_data"]
members = [
    "pilotdeck-cli",
    "pilotdeck-agent",
    "pilotdeck-transport",
    "pilotdeck-protocol",
    "pilotdeck-tokenizer",
    "pilotdeck-gateway",
    "pilotdeck-child-signals",
    "pilotdeck-yaml",
    "pilotdeck-regex-proto",
    "pilotdeck-context-core",
    "pilotdeck-context-runtime",
    "pilotdeck-context-iface",
    "pilotdeck-model-core",
    "pilotdeck-model-runtime",
    "pilotdeck-http-transport",
    "pilotdeck-trusted-http-host",
    "pilotdeck-tool-core",
    "pilotdeck-tool-iface",
    "pilotdeck-model-iface",
    "pilotdeck-iface",
    "pilotdeck-turn-preparation",
]

[workspace.package]
edition = "2024"
rust-version = "1.93"
version = "0.1.0"
license = "AGPL-3.0-only"
license-file = "../LICENSE"
publish = false

[workspace.dependencies]
agentcpm-iface = { path = "../deps/agent-kernel/kernel/iface" }
agentcpm-scheduler-protocol = { path = "../deps/agent-kernel/kernel/scheduler-protocol" }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
ryu-js = "=1.0.3"
sha2 = "=0.10.9"
md-5 = "=0.10.6"
tz-rs = { version = "=0.7.3", default-features = false, features = ["alloc"] }
# #1265 (human decision #1264 选 C): bounded JS RegExp prototype. Pinned to the
# exact crates.io release; the bundled QuickJS-NG C sources are compiled from
# source by rquickjs-sys, no prebuilt binary is downloaded. Optional per-crate:
# only pilotdeck-regex-proto's non-default `regex-proto` feature enables it.
rquickjs = "=0.14.0"
pilotdeck-protocol = { path = "pilotdeck-protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
# #438: a side effect inside debug_assert! vanishes in release builds.
debug_assert_with_mut_call = "warn"

# D6 data stays pinned; #132 adds a source patch to preserve isolated UTF-16 weights.
[patch.crates-io]
icu_collator_data = { path = "data/icu_collator_data" }
icu_collator = { path = "vendor/icu_collator" }

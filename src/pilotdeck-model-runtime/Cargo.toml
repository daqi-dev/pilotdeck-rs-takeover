[package]
name = "pilotdeck-model-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
pilotdeck-protocol.workspace = true
pilotdeck-model-core = { path = "../pilotdeck-model-core" }
bytes = "=1.10.1"
hyper = { version = "=1.7.0", default-features = false, features = ["http1"] }
http-body-util = "=0.1.3"
tokio = { version = "=1.48.0", default-features = false, features = ["macros", "rt", "sync", "time"] }
url = "=2.5.8"
uuid = { version = "=1.27.0", features = ["v4"] }

[dev-dependencies]
sha2.workspace = true
tokio = { version = "=1.48.0", default-features = false, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true

[package]
name = "pilotdeck-http-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pilotdeck-model-runtime = { path = "../pilotdeck-model-runtime" }
pilotdeck-protocol.workspace = true
base64 = "=0.22.1"
bytes = "=1.10.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.7.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.17", features = ["client-legacy", "http1", "tokio"] }
async-compression = { version = "=0.4.51", features = ["tokio", "gzip", "zlib", "deflate", "brotli"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "ring"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
webpki-roots = "=1.0.9"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tower-service = "=0.3.3"
tokio = { version = "=1.48.0", features = ["rt", "net", "time", "io-util", "sync"] }
url = "=2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[dev-dependencies]
serde_json.workspace = true
uuid = { version = "=1.27.0", features = ["v4"] }
tokio = { version = "=1.48.0", features = ["macros", "rt", "sync", "test-util"] }

[lints]
workspace = true
